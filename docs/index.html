<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRTH · Luxury gifts from Madinah</title>
<meta name="description" content="IRTH: dates, saffron, oud and prayer pieces, hand-selected in Madinah Al Munawwarah and carried to your door.">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=DM+Serif+Display:ital@0;1&amp;family=Instrument+Serif:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&amp;family=Libre+Baskerville:ital@0;1&amp;family=Libre+Caslon+Text:ital,wght@0,400;1,400&amp;family=Spectral:ital,wght@0,400;1,400;1,500&amp;family=Gloock&amp;family=Cinzel:wght@400;500&amp;family=Jost:wght@300;400;500&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7EFE5;font-family:'Jost',system-ui,sans-serif;color:#1F2E26}
a{color:inherit;text-decoration:none;cursor:pointer}a:hover{opacity:.75}
button{font-family:'Jost',system-ui,sans-serif;cursor:pointer}
input,select,textarea{font-family:'Jost',system-ui,sans-serif}
input::placeholder,textarea::placeholder{color:#9C948C}
.grain{background-image:url(assets/2c340613497aa0376c4223c477cdf92b.png);background-size:512px}
.pl{background-color:#EFE5D9;background-image:url(assets/2c340613497aa0376c4223c477cdf92b.png);background-size:512px}
.pp{background-color:#E8DACD;background-image:url(assets/2c340613497aa0376c4223c477cdf92b.png);background-size:512px}
.pd{background-color:#C8B098;background-image:url(assets/2c340613497aa0376c4223c477cdf92b.png);background-size:512px}
.ol{background-image:url(assets/2c340613497aa0376c4223c477cdf92b.png);background-size:512px}
.spr{background-image:url(assets/7ccda7198dee3d98f8eb020e4495aee1.webp);background-size:1000% 600%;background-repeat:no-repeat;background-position:0% 0%}
.dust{animation:irthDust 40s linear infinite}
@keyframes irthDust{0%{background-position:0 0}100%{background-position:-512px 180px}}
@keyframes irthIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cap{font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.btn{height:50px;padding:0 30px;border:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase}
.fld{height:48px;border:1px solid #D9C9B7;background:#FBF6F0;padding:0 16px;font-size:15px;color:#1F2E26;outline:none;box-sizing:border-box;width:100%}
.fld:focus{border-color:#4E4A47}
.lnk{border-bottom:1px solid currentColor;padding-bottom:4px}
.card-img{transition:transform .6s ease}.nav-dd{opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .28s ease,transform .28s ease,visibility .28s}.nav-item:hover .nav-dd,.nav-item:focus-within .nav-dd{opacity:1;visibility:visible;transform:none}.dd-chev{transition:transform .25s ease}.dd-img{transition:transform .7s ease}.dd-tile:hover .dd-img{transform:scale(1.06)}.nav-item:hover .dd-chev{transform:rotate(180deg)}.dd-link:hover{color:#6D2C26}.door-btn[aria-pressed="false"]:hover{background:rgba(31,46,38,0.5) !important}.card:hover .card-img{transform:scale(1.04)}.sr-it img{transition:transform .6s ease}.sr-it:hover img{transform:scale(1.04)}.sr-it:hover .sr-nm{color:#6D2C26}.rv-it:hover .rv-nm{color:#6D2C26}.qv-btn{opacity:0;translate:0 6px;transition:opacity .25s ease,translate .25s ease}.card:hover .qv-btn,.qv-btn:focus-visible{opacity:1;translate:0 0}.qv-btn:hover{background:#FFFFFF !important}.xs-add{transition:background .2s ease}.xs-add:hover{background:#393723 !important}.nav-ic{transition:opacity .2s ease}.nav-ic:hover{opacity:.62}.nav-ic:focus-visible{outline:1px solid currentColor;outline-offset:2px}.pg-btn{transition:background .2s ease,opacity .2s ease}.pg-btn[aria-current="false"]:hover{background:#E8DACD !important}.cat-vp:focus-visible{box-shadow:inset 0 0 0 2px #6D2C26}.med .seal{transition:background .3s ease}.med .seal-in{transition:color .3s ease,border-color .3s ease}.med:hover .seal{background:#6E7059}.med:hover .seal-in{color:#F7EFE5 !important;border-color:rgba(247,239,229,.5) !important}.cta{transition:background .25s ease,color .25s ease,box-shadow .25s ease}.qb{cursor:pointer;transition:background .2s ease}.qb:hover{background:#EFE5D8 !important}.cta:hover{background:#393723 !important}.cta:active{background:#2B2A1B !important}.cta.ghost:hover{background:#1F2E26 !important;color:#F7EFE5 !important;box-shadow:inset 0 0 0 1px #1F2E26 !important}.cta.ghost:active{background:#12201A !important;color:#F7EFE5 !important;box-shadow:inset 0 0 0 1px #12201A !important}.cta.done:hover{background:#2B2A1B !important}.heart{transition:transform .2s ease}.heart:hover{transform:scale(1.08)}
.page{animation:irthIn .5s ease both}
@media (prefers-reduced-motion: reduce){.dust,.page{animation:none}.card-img{transition:none}}
*:focus-visible{outline:2px solid #6D2C26;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
.skel{background:linear-gradient(90deg,#E8DACD 0%,#F1E6D9 50%,#E8DACD 100%);background-size:200% 100%;animation:skel 1.2s ease-in-out infinite}@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"></div>
<template id="irth-template">
<div style="width: 100%; height: {{rootH}}; position: relative; background: #F7EFE5; color: #1F2E26; overflow-x: clip;">

<!-- ============ FIXED HEADER (all pages; on Home it appears after the hero) ============ -->
<header style="position: fixed; z-index: 40; left: 0; right: 0; top: 0; height: 88px; padding: 0 44px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; background: rgba(243,237,227,0.96); border-bottom: 1px solid #D9C9B7; opacity: {{hdrOpacity}}; pointer-events: {{hdrPointer}}; transform: translateY({{hdrShift}}px); transition: opacity .35s ease, transform .35s ease;">
<nav aria-label="Main" style="display: flex; gap: 30px;">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="4">
<div class="nav-item" style="padding: 30px 0; margin: -30px 0;">
<a href="#" onClick="{{n.go}}" class="cap" style="display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; padding-bottom: 5px; border-bottom: {{n.border}};">{{n.label}}<sc-if value="{{n.isStore}}" hint-placeholder-val="{{ false }}"> <svg class="dd-chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if></a>
<sc-if value="{{n.isStore}}" hint-placeholder-val="{{ false }}">
<div class="nav-dd" style="position: absolute; left: 0; right: 0; top: 100%; z-index: 40; text-transform: none; letter-spacing: normal; color: #1F2E26;">
<div style="background: #F7EFE5; border-top: 1px solid #D9C9B7; box-shadow: 0 40px 80px -40px rgba(0,0,0,0.6); padding: 48px 64px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 64px; text-align: left;">
<div style="display: flex; flex-direction: column; gap: 30px;">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 40px;">
<sc-for list="{{megaHouses}}" as="h" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="#" onClick="{{h.go}}" class="cap dd-link" style="font-size: 9.5px; color: #6D2C26;">{{h.roman}} · {{h.name}}</a>
<sc-for list="{{h.cats}}" as="c" hint-placeholder-count="3">
<a href="#" onClick="{{c.go}}" class="dd-link" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; line-height: 1.25; display: flex; gap: 10px; align-items: baseline;">{{c.name}}</a>
</sc-for>
</div>
</sc-for>
</div>
<a href="#" onClick="{{go.store}}" class="cap" style="align-self: flex-start; font-size: 10.5px; color: #6D2C26; display: inline-flex; gap: 10px; align-items: center; border-top: 1px solid #D9C9B7; padding-top: 20px;">View all {{catTotal}} pieces <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<a href="#" onClick="{{ddFeatured.open}}" class="dd-tile" style="display: flex; flex-direction: column; gap: 14px; border-left: 1px solid #D9C9B7; padding-left: 48px;">
<span class="cap" style="font-size: 9.5px; color: #6D2C26;">Featured</span>
<div style="height: 250px; overflow: hidden; background: #E8DACD;"><img class="dd-img" src="{{ddFeatured.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
<span class="serif" style="font-size: 24px; font-weight: 500; line-height: 1.15;">{{ddFeatured.name}}</span>
<span class="cap" style="font-size: 10px; color: #6D2C26; display: inline-flex; gap: 10px; align-items: center;">Discover <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</div>
</div>
</sc-if>
</div>
</sc-for>
</nav>
<a href="#" onClick="{{go.home}}" aria-label="IRTH home" style="display: flex; align-items: center; gap: 14px;">
<img src="assets/6bce5d7771043882a11c78312ae3b4bb.png" alt="" style="height: 50px; width: auto; display: block;">
<span style="font-family: 'Marcellus', Georgia, serif; font-size: 20px; letter-spacing: 0.5em; padding-left: 0.5em;">IRTH</span>
</a>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px;">
<button type="button" onClick="{{openSearch}}" aria-label="Search" class="nav-ic" style="min-width: 58px; height: 56px; padding: 0 6px; border: 0; background: transparent; color: #1F2E26; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><span style="position: relative; display: flex;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></span><span style="font-size: 10.5px; letter-spacing: .08em; white-space: nowrap;">Search</span></button>
<button type="button" onClick="{{go.account}}" aria-label="{{accountLabel}}" class="nav-ic" style="min-width: 58px; height: 56px; padding: 0 6px; border: 0; background: transparent; color: #1F2E26; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><span style="position: relative; display: flex;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"></path></svg></span><span style="font-size: 10.5px; letter-spacing: .08em; white-space: nowrap;">{{accountLabel}}</span></button>
<button type="button" onClick="{{go.wishlist}}" aria-label="Wishlist, {{wishCount}} saved" class="nav-ic" style="min-width: 58px; height: 56px; padding: 0 6px; border: 0; background: transparent; color: #1F2E26; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><span style="position: relative; display: flex;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg><sc-if value="{{wishHas}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -5px; right: -9px; min-width: 17px; height: 17px; border-radius: 9px; background: #6D2C26; color: #F7EFE5; font-size: 9.5px; font-weight: 500; letter-spacing: 0; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box;">{{wishCount}}</span></sc-if></span><span style="font-size: 10.5px; letter-spacing: .08em; white-space: nowrap;">Wishlist</span></button>
<button type="button" onClick="{{openCart}}" aria-label="Bag, {{cartCount}} items, {{cartTotalText}}" class="nav-ic" style="min-width: 58px; height: 56px; padding: 0 6px; border: 0; background: transparent; color: #1F2E26; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><span style="position: relative; display: flex;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><sc-if value="{{cartHas}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -5px; right: -9px; min-width: 17px; height: 17px; border-radius: 9px; background: #6D2C26; color: #F7EFE5; font-size: 9.5px; font-weight: 500; letter-spacing: 0; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box;">{{cartCount}}</span></sc-if></span><span style="font-size: 10.5px; letter-spacing: .08em; white-space: nowrap;">Bag</span></button>
</div>
</header>

<!-- ============ HOME ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div>
<div data-track="1" style="position: relative; height: {{trackH}}px; background: #1F2E26;">
<sc-for list="{{stages}}" as="st" hint-placeholder-count="1">
<section data-stage="{{st.i}}" style="position: {{stagePos}}; top: 0; height: {{stageH}}px; overflow: hidden; background: #E9C58A; border-bottom: {{st.border}};">
<div style="position: absolute; inset: 0; overflow: hidden;">
<img data-k="photo" src="assets/2827fb1c110ef42de4fe70b9c641e1d5.jpg" alt="A caravan of camels crossing golden dunes" style="width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 0%; transform: scale(1.7); will-change: transform;">
</div>
<div data-k="haze" aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 60%; background: linear-gradient(180deg, rgba(252,240,218,0.85) 0%, rgba(250,232,200,0.45) 45%, rgba(250,232,200,0) 100%); pointer-events: none;"></div>
<div data-k="sun" aria-hidden="true" style="position: absolute; left: 50%; top: -120px; width: 900px; height: 520px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(255,250,236,0.95) 0%, rgba(255,236,196,0.5) 30%, rgba(255,230,190,0) 68%); pointer-events: none;"></div>
<div aria-hidden="true" style="position: absolute; right: -10%; top: -30%; width: 80%; height: 90%; background: radial-gradient(ellipse at 70% 30%, rgba(255,226,170,0.45) 0%, rgba(255,214,150,0.12) 40%, rgba(255,214,150,0) 70%); mix-blend-mode: screen; pointer-events: none;"></div>
<div class="dust grain" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.35; mix-blend-mode: soft-light; pointer-events: none;"></div>
<div data-k="dim" aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,20,10,0) 0%, rgba(30,20,10,0.25) 55%, rgba(30,20,10,0.55) 100%); opacity: 0; pointer-events: none;"></div>
<div data-k="olive" class="ol" aria-hidden="true" style="position: absolute; inset: 0; background-color: {{deep}}; opacity: 0; pointer-events: none;"></div>
<div data-k="glow" aria-hidden="true" style="position: absolute; left: 66%; top: 54%; width: 760px; height: 760px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(222,184,112,0.5) 0%, rgba(222,184,112,0.14) 40%, rgba(222,184,112,0) 66%); opacity: 0; pointer-events: none;"></div>
<div data-k="datewrap" style="position: absolute; left: 66%; top: 54%; width: 470px; height: 470px; transform: translate(-50%, -50%); opacity: 0; will-change: transform;">
<div data-k="date" class="spr" role="img" aria-label="A Madinah date turning slowly" style="width: 100%; height: 100%;"></div>
</div>
<img data-k="palmL" src="assets/da50814b7e3bcab8b8d0311a8e669ba0.svg" alt="" aria-hidden="true" style="position: absolute; left: -230px; bottom: -260px; height: 128%; width: auto; transform-origin: 30% 100%; filter: blur(1.4px) brightness(0.9); will-change: transform; pointer-events: none;">
<img data-k="palmR" src="assets/aa5e873188acacadcdd35822a0a8c7c8.svg" alt="" aria-hidden="true" style="position: absolute; right: -240px; bottom: -220px; height: 112%; width: auto; transform-origin: 70% 100%; filter: blur(1.1px) brightness(0.9); will-change: transform; pointer-events: none;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(30,18,8,0) 55%, rgba(30,18,8,0.38) 100%); pointer-events: none;"></div>
<div class="grain" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none;"></div>


<sc-if value="{{annOn}}" hint-placeholder-val="{{ true }}"><div role="region" aria-label="Announcement" style="position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 36px; background: #1F2E26; color: #E8DACD; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 11.5px; letter-spacing: .14em;"><span style="display: flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"></path><circle cx="7" cy="17.5" r="1.6"></circle><circle cx="17" cy="17.5" r="1.6"></circle></svg></span><span>IRTH is officially open · Pay on delivery available</span><span style="opacity: .45;">|</span><a href="#" onClick="{{toMembership}}" style="border-bottom: 1px solid currentColor;">Become a Gold Member</a><button type="button" onClick="{{closeAnn}}" aria-label="Dismiss announcement" style="position: absolute; right: 16px; width: 32px; height: 32px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></sc-if>
<header data-k="hdr" style="position: absolute; z-index: 3; left: 0; right: 0; top: {{annTop}}px; height: 88px; padding: 0 44px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; color: #1F2E26;">
<nav aria-label="Main" style="display: flex; gap: 30px;">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="4">
<a href="#" onClick="{{n.go}}" class="cap" style="display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; padding-bottom: 5px; border-bottom: {{n.heroBorder}};">{{n.label}}</a>
</sc-for>
</nav>
<a href="#" onClick="{{go.home}}" aria-label="IRTH home" style="display: flex; align-items: center; gap: 14px;">
<span style="position: relative; width: 22px; height: 50px; display: block;">
<img data-k="logoDark" src="assets/6bce5d7771043882a11c78312ae3b4bb.png" alt="" style="position: absolute; inset: 0; height: 50px; width: auto; display: block;">
<img data-k="logoLight" src="assets/b086fa6a47e4bc2a1540b35c9e94a042.png" alt="" style="position: absolute; inset: 0; height: 50px; width: auto; display: block; opacity: 0;">
</span>
<span style="font-family: 'Marcellus', Georgia, serif; font-size: 20px; letter-spacing: 0.5em; padding-left: 0.5em;">IRTH</span>
</a>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px;">

</div>
</div>
</div>
</sc-for>
<sc-if value="{{xsHas}}" hint-placeholder-val="{{ true }}">
<div style="padding: 26px 0 18px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; gap: 14px;"><span class="cap" style="font-size: 10px; color: #6D2C26; white-space: nowrap;">Pairs well with</span><span style="flex-grow: 1; height: 1px; background: #D9C9B7;"></span></div>
<sc-for list="{{crossSell}}" as="x" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px; background: #FBF6EF; box-shadow: inset 0 0 0 1px #E4D6C5;">
<a href="#" onClick="{{x.open}}"><img src="{{x.img}}" alt="" style="width: 64px; height: 64px; object-fit: cover; display: block;"></a>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;"><a href="#" onClick="{{x.open}}" class="serif" style="font-size: 17px; line-height: 1.2;">{{x.name}}</a><span style="font-size: 12px; color: #4E4A47;">{{x.priceText}}</span></div>
<button type="button" onClick="{{x.add}}" aria-label="Add {{x.name}} to bag" class="xs-add" style="height: 38px; padding: 0 14px; border: 0; background: #6E7059; color: #F7EFE5; display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Add</button>
</div>
</sc-for>
</div>
</sc-if>
</div>
<sc-if value="{{cartHas}}" hint-placeholder-val="{{ true }}">
<div style="padding: 24px 28px 28px; border-top: 1px solid #D9C9B7; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; justify-content: space-between; font-size: 17px;"><span>Subtotal</span><span>{{cartTotalText}}</span></div>
<span style="font-size: 12px; color: #4E4A47;">Shipping and payment options at checkout · pay on delivery available.</span>
<button type="button" onClick="{{go.checkout}}" class="btn" style="background: {{deep}}; color: #F7EFE5; width: 100%;">Checkout</button>
<button type="button" onClick="{{closeCart}}" class="btn" style="background: transparent; border: 1px solid #1F2E26; color: #1F2E26; width: 100%;">Continue shopping</button>
</div>
</sc-if>
</aside>
</div>
</sc-if>

<!-- ============ SEARCH POPUP ============ -->
<sc-if value="{{searchOpen}}" hint-placeholder-val="{{ false }}">
<div onKeyDown="{{searchKey}}" style="position: fixed; inset: 0; z-index: 70; overflow-y: auto; padding: 64px 24px 40px; box-sizing: border-box;">
<button type="button" onClick="{{closeSearch}}" aria-label="Close search" style="position: fixed; inset: 0; border: 0; background: rgba(31,26,18,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer;"></button>
<div role="dialog" aria-modal="true" aria-label="Search IRTH" style="position: relative; width: 1240px; max-width: 100%; margin: 0 auto; background: #F7EFE5; border-radius: 22px; overflow: hidden; box-shadow: 0 40px 100px -30px rgba(0,0,0,.6);">
<label style="height: 92px; padding: 0 26px 0 34px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #D9C9B7; color: #1F2E26;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg><input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Search dates, coffee, gifts…" aria-label="Search products" autofocus="" style="flex-grow: 1; min-width: 0; height: 60px; border: 0; background: transparent; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; color: #1F2E26; outline: none; padding: 0;"><span class="cap" aria-hidden="true" style="font-size: 9.5px; color: #7A7570; border: 1px solid #D9C9B7; padding: 6px 9px; border-radius: 4px; letter-spacing: .16em;">Esc</span><button type="button" onClick="{{closeSearch}}" aria-label="Close search" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1F2E26; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></label>
<div style="padding: 30px 38px 40px; display: flex; flex-direction: column; gap: 22px;">
<sc-if value="{{noQuery}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{recentHas}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="cap" style="font-size: 10.5px; color: #6D2C26;">Recently viewed</span><button type="button" onClick="{{clearRecent}}" class="cap" style="border: 0; background: transparent; font-size: 10.5px; color: #4E4A47; border-bottom: 1px solid currentColor; padding: 0 0 3px;">Clear</button></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">
<sc-for list="{{recentItems}}" as="r" hint-placeholder-count="4">
<a href="#" onClick="{{r.open}}" class="sr-it" style="display: flex; flex-direction: column; gap: 12px; min-width: 0;"><span style="display: block; height: 230px; overflow: hidden; background: #E8DACD;"><img src="{{r.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="display: flex; flex-direction: column; gap: 4px;"><span class="serif sr-nm" style="font-size: 20px; line-height: 1.15; font-weight: 500;">{{r.name}}</span><span style="font-family: 'Marcellus', Georgia, serif; font-size: 14px; color: #4E4A47;">{{r.priceText}}</span></span></a>
</sc-for>
</div>
<span style="height: 1px; background: #E4D6C5; margin-top: 6px;"></span>
</sc-if>
<div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="cap" style="font-size: 10.5px; color: #6D2C26;">Products</span><a href="#" onClick="{{go.store}}" class="cap" style="font-size: 10.5px; border-bottom: 1px solid currentColor; padding-bottom: 3px;">View all {{catTotal}}</a></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">
<sc-for list="{{searchSuggest}}" as="r" hint-placeholder-count="4">
<a href="#" onClick="{{r.open}}" class="sr-it" style="display: flex; flex-direction: column; gap: 12px; min-width: 0;"><span style="display: block; height: 230px; overflow: hidden; background: #E8DACD;"><img src="{{r.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="display: flex; flex-direction: column; gap: 4px;"><span class="serif sr-nm" style="font-size: 20px; line-height: 1.15; font-weight: 500;">{{r.name}}</span><span style="font-family: 'Marcellus', Georgia, serif; font-size: 14px; color: #4E4A47;">{{r.priceText}}</span></span></a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{hasQuery}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="cap" style="font-size: 10.5px; color: #6D2C26;">{{searchCountText}}</span><sc-if value="{{searchMore}}" hint-placeholder-val="{{ false }}"><a href="#" onClick="{{searchAll}}" class="cap" style="font-size: 10.5px; border-bottom: 1px solid currentColor; padding-bottom: 3px;">View all results</a></sc-if></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">
<sc-for list="{{searchTop}}" as="r" hint-placeholder-count="4">
<a href="#" onClick="{{r.open}}" class="sr-it" style="display: flex; flex-direction: column; gap: 12px; min-width: 0;"><span style="display: block; height: 230px; overflow: hidden; background: #E8DACD;"><img src="{{r.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="display: flex; flex-direction: column; gap: 4px;"><span class="serif sr-nm" style="font-size: 20px; line-height: 1.15; font-weight: 500;">{{r.name}}</span><span style="font-family: 'Marcellus', Georgia, serif; font-size: 14px; color: #4E4A47;">{{r.priceText}}</span></span></a>
</sc-for>
</div>
<sc-if value="{{searchNone}}" hint-placeholder-val="{{ false }}"><div style="padding: 20px 0 10px; display: flex; flex-direction: column; gap: 10px;"><span class="serif" style="font-size: 26px;">Nothing matches “{{q}}”.</span><span style="font-size: 14px; color: #4E4A47;">Try “dates”, “coffee” or “oud”.</span></div></sc-if>
</sc-if>
</div>
</div>
</div>
</sc-if>

<!-- ============ QUICK VIEW ============ -->
<sc-if value="{{qvOpen}}" hint-placeholder-val="{{ false }}">
<div onKeyDown="{{qvKey}}" style="position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px;">
<button type="button" onClick="{{closeQv}}" aria-label="Close quick view" style="position: absolute; inset: 0; border: 0; background: rgba(31,26,18,0.5); cursor: pointer;"></button>
<div role="dialog" aria-modal="true" aria-label="Quick view: {{quickView.name}}" style="position: relative; width: 940px; max-width: 100%; max-height: calc(100vh - 48px); overflow: auto; background: #F7EFE5; display: grid; grid-template-columns: 440px minmax(0, 1fr); box-shadow: 0 40px 100px -30px rgba(0,0,0,.6);">
<div style="position: relative; min-height: 540px; background: #E8DACD;"><img src="{{quickView.img}}" alt="{{quickView.name}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></div>
<div style="padding: 44px 44px 36px; display: flex; flex-direction: column; gap: 14px;">
<button type="button" onClick="{{closeQv}}" aria-label="Close" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; background: transparent; color: #1F2E26; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<span class="cap" style="font-size: 10px; color: #6D2C26;">{{quickView.cat}}</span>
<h2 class="serif" style="margin: 0; font-weight: 500; font-size: 36px; line-height: 1.08;">{{quickView.name}}</h2>
<span style="font-family: 'Marcellus', Georgia, serif; font-size: 18px; letter-spacing: .06em;">{{quickView.priceText}}</span>
<p style="margin: 4px 0 0; font-size: 14.5px; line-height: 1.7; color: #4E4A47;">{{quickView.desc}}</p>
<div style="margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; gap: 10px; height: 52px;">
<div role="group" aria-label="Quantity" style="display: flex; align-items: center; box-shadow: inset 0 0 0 1px #6E7059; color: #6E7059;"><button type="button" onClick="{{quickView.dec}}" aria-label="Decrease quantity" style="width: 44px; height: 52px; border: 0; background: transparent; color: inherit; font-size: 18px;">−</button><span aria-live="polite" style="width: 24px; text-align: center; font-family: 'Marcellus', Georgia, serif; color: #1F2E26;">{{quickView.qty}}</span><button type="button" onClick="{{quickView.inc}}" aria-label="Increase quantity" style="width: 44px; height: 52px; border: 0; background: transparent; color: inherit; font-size: 18px;">+</button></div>
<button type="button" onClick="{{quickView.addQv}}" class="btn cta" style="flex-grow: 1; height: 52px; background: #6E7059; color: #F7EFE5; gap: 10px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Add to bag</button>
<button type="button" onClick="{{quickView.toggleWish}}" aria-label="{{quickView.wishLabel}}" style="width: 52px; height: 52px; border: 0; box-shadow: inset 0 0 0 1px #C8B098; background: transparent; color: #6D2C26; font-size: 20px;">{{quickView.heart}}</button>
</div>
<a href="#" onClick="{{quickView.details}}" class="cap" style="align-self: flex-start; font-size: 10.5px; border-bottom: 1px solid currentColor; padding-bottom: 4px;">View full details</a>
</div>
</div>
</div>
</div>
</sc-if>



<!-- ============ TOAST ============ -->
<sc-if value="{{toastBag}}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="position: fixed; z-index: 80; left: 50%; bottom: 32px; transform: translateX(-50%); width: 570px; max-width: calc(100vw - 32px); box-sizing: border-box; background: #6E7059; color: #F7EFE5; display: flex; align-items: center; gap: 20px; padding: 14px 16px 14px 14px; box-shadow: 0 24px 50px -24px rgba(0,0,0,.6);">
<img src="{{toastP.img}}" alt="" style="width: 72px; height: 88px; object-fit: cover; display: block; flex-shrink: 0; background: #E8DACD;">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;"><span class="cap" style="font-size: 9.5px; color: #E8DACD; display: inline-flex; gap: 8px; align-items: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg> Added to your bag</span><span class="serif" style="font-size: 21px; line-height: 1.15;">{{toastP.name}}</span><span style="font-size: 12.5px; color: rgba(247,239,229,.78);">{{toastP.meta}}</span></div>
<button type="button" onClick="{{openCart}}" class="btn" style="height: 48px; padding: 0 24px; background: #E8DACD; color: #1F2E26; flex-shrink: 0;">View bag</button>
<button type="button" onClick="{{closeToast}}" aria-label="Dismiss" style="width: 32px; height: 32px; border: 0; background: transparent; color: #E8DACD; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{toastMsg}}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="position: fixed; z-index: 80; left: 50%; bottom: 32px; transform: translateX(-50%); width: 460px; max-width: calc(100vw - 32px); box-sizing: border-box; background: #1F2E26; color: #F7EFE5; display: flex; gap: 16px; align-items: center; padding: 16px 16px 16px 18px; box-shadow: 0 24px 50px -24px rgba(0,0,0,.6);">
<span style="width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1px #E8DACD; color: #E8DACD; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><sc-if value="{{toastIcon.check}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if><sc-if value="{{toastIcon.heart}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg></sc-if><sc-if value="{{toastIcon.bell}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></sc-if><sc-if value="{{toastIcon.gift}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10"></rect><rect x="3" y="7" width="18" height="3"></rect><path d="M12 7v13M12 7c-1.5-3-5-3.5-5-1.5S10 7 12 7zM12 7c1.5-3 5-3.5 5-1.5S14 7 12 7z"></path></svg></sc-if></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;"><span style="font-size: 14.5px; font-weight: 500;">{{toastTitle}}</span><span style="font-size: 12.5px; opacity: .78;">{{toastSub}}</span></span>
<button type="button" onClick="{{closeToast}}" aria-label="Dismiss" style="width: 32px; height: 32px; border: 0; background: transparent; color: #E8DACD; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>


</div>
</template>
<script src="runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
